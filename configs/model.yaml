# Model Architecture Parameters
VAE_ENCODER:
  in_channels: 3
  latent_channels: 4
  hidden_dims: [64, 128, 256]

PROJECTION_HEAD:
  latent_spatial_size: 32 # Corresponds to 256 / (2^3 downsampling)
  latent_channels: 4
  projection_dim: 128

UNET_MODEL:
  latent_channels: 4
  cond_channels: 8       # 4ch L_SAR + 4ch L_Cloudy
  out_channels: 4
  base_channels: 64
  time_emb_dim: 256